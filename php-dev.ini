; ActivityDMS — dev server PHP overrides
; ใช้กับ: php -S localhost:8000 -c php-dev.ini
;
; ค่า default ของ PHP (upload_max_filesize=2M, post_max_size=8M)
; ต่ำกว่าที่สเปคกำหนด (ไฟล์ ≤ 10MB, รวม 10 ไฟล์ต่อกิจกรรม)
; ทำให้อัปโหลดไฟล์แนบล้มเหลวเงียบ ๆ บน dev server

upload_max_filesize = 12M
post_max_size = 128M
max_file_uploads = 25
memory_limit = 256M
file_uploads = On

; UTF-8 + Bangkok timezone (ตรงกับ .env)
default_charset = "UTF-8"
date.timezone = Asia/Bangkok

; Dev: เปิด error display
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

; Sessions
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
